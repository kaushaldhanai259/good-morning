<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scrapbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f1ea;
            --accent-color: #d4a373;
            --tape-color: rgba(212, 163, 115, 0.3);
            --text-color: #4a4a4a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        /* Bento Box Grid */
        .scrapbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            grid-auto-rows: 300px;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Polaroid Card Styles */
        .polaroid {
            background: white;
            padding: 15px 15px 40px 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(20%);
        }

        .polaroid:nth-child(even) { transform: rotate(-2deg); }
        .polaroid:nth-child(odd) { transform: rotate(2deg); }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* Washi Tape Effect */
        .polaroid::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: var(--tape-color);
            backdrop-filter: blur(2px);
            z-index: 2;
        }

        .caption {
            font-family: 'Dancing Script', cursive;
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
            color: var(--text-color);
        }

        /* Bento Span Logic */
        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }

        @media (max-width: 768px) {
            .wide, .tall { grid-column: span 1; grid-row: span 1; }
        }

        footer {
            text-align: center;
            margin-top: 80px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Little Moments</h1>
        <p>A collection of memories, art, and everything in between.</p>
    </header>

    <div class="scrapbook-grid">
        <!-- Photo 1 (Tall) -->
        <div class="polaroid tall">
            <img src="https://via.placeholder.com/500x800" alt="Memory 1">
            <div class="caption">Mountain Mornings</div>
        </div>

        <!-- Photo 2 (Wide) -->
        <div class="polaroid wide">
            <img src="https://via.placeholder.com/800x400" alt="Memory 2">
            <div class="caption">City Lights & Late Nights</div>
        </div>

        <!-- Photo 3 -->
        <div class="polaroid">
            <img src="https://via.placeholder.com/400x400" alt="Memory 3">
            <div class="caption">Coffee Dates</div>
        </div>

        <!-- Photo 4 -->
        <div class="polaroid">
            <img src="https://via.placeholder.com/400x400" alt="Memory 4">
            <div class="caption">Sunset Bliss</div>
        </div>

        <!-- Photo 5 (Wide) -->
        <div class="polaroid wide">
            <img src="https://via.placeholder.com/800x400" alt="Memory 5">
            <div class="caption">The Best Weekend Ever</div>
        </div>
    </div>

    <footer>
        <p>Built with ♡ and hosted on GitHub Pages</p>
    </footer>

    <script>
        // Simple Interaction: Click a polaroid to "shake" it
        document.querySelectorAll('.polaroid').forEach(item => {
            item.addEventListener('click', () => {
                item.style.transition = '0.1s';
                item.style.transform = 'translateX(5px)';
                setTimeout(() => item.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => {
                    item.style.transition = '0.4s';
                    item.style.transform = 'rotate(0deg) scale(1.05)';
                }, 100);
            });
        });
    </script>
</body>
</html>
